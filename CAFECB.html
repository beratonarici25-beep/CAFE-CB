<!DOCTYPE html>
<meta charset="utf-8">
<title>Cafe C&amp;B</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: café counter scene across the top, barista bench below (sticky cup + order ticket beside numbered station cards). Single cozy light look by choice. */
:root {
  --wall: #d4ebe0;
  --wall-2: #c8e4d7;
  --paper: #fffaf3;
  --ink: #4b2e2b;
  --ink-soft: #85675f;
  --blush: #f4b9b2;
  --blush-deep: #e8968c;
  --butter: #f6d88c;
  --mint: #8cc7ae;
  --sky: #acc9ec;
  --wood: #d39c78;
  --wood-top: #e8b994;
  --bench: #f3e6f0;
  --good: #4f9e70;
  --bad: #d4685a;
  --shadow: 0 3px 0 var(--ink);
  --font-display: 'Grandstander', 'Comic Sans MS', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-ticket: 'Courier Prime', 'Courier New', monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bench);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }

/* ---------- top bar ---------- */
.topbar {
  position: relative; z-index: 25;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--ink); color: var(--paper);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .04em; }
.brand b { color: var(--blush); }
.hud { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.pill {
  font-weight: 800; font-size: 13px; padding: 3px 10px; border-radius: 999px;
  background: rgba(255,250,243,.12); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.pill.cash { background: var(--butter); color: var(--ink); }
.iconbtn {
  border: 0; background: rgba(255,250,243,.14); color: var(--paper); border-radius: 10px;
  padding: 4px 10px; font-weight: 800; font-size: 13px; cursor: pointer;
}
.iconbtn:hover { background: rgba(255,250,243,.24); }
.iconbtn.lang { background: var(--blush); color: var(--ink); }

/* ---------- scene ---------- */
.scene { position: relative; min-height: 236px; overflow: hidden; border-bottom: 3px solid var(--ink); }
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.talk {
  position: relative; z-index: 1;
  margin-left: max(150px, 34%);
  padding-block: 18px 58px;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 760px;
}
.bubble {
  position: relative; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px;
  padding: 10px 14px 12px; box-shadow: var(--shadow); min-height: 84px;
}
.bubble::before {
  content: ""; position: absolute; left: -15px; bottom: 22px; width: 22px; height: 22px;
  background: var(--paper); border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
  transform: rotate(45deg) skew(10deg, 10deg);
}
.who { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.patience { flex: 1; height: 8px; border-radius: 99px; background: #eadfd6; overflow: hidden; max-width: 160px; margin-left: auto; }
.patience i { display: block; height: 100%; width: 100%; background: var(--mint); border-radius: 99px; transition: background .3s; }
.say { font-size: 16px; font-weight: 600; margin: 4px 0 0; min-height: 1.45em; }
.talk-actions { margin-top: 10px; display: flex; gap: 8px; }

/* ---------- buttons ---------- */
.btn {
  border: 3px solid var(--ink); border-radius: 14px; background: var(--paper);
  padding: 8px 16px; font-weight: 800; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .08s, box-shadow .08s;
  touch-action: manipulation;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled), .btn.active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--blush); }
.btn.go { background: var(--mint); }
.btn.big { font-size: 18px; padding: 10px 22px; font-family: var(--font-display); }
.btn.hold { background: var(--butter); width: 100%; user-select: none; -webkit-user-select: none; touch-action: none; }
.btn.hold.active { background: #f2c55a; }

/* ---------- bench ---------- */
.bench {
  display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start;
  padding-block: 18px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1280px; margin: 0 auto;
  transition: opacity .2s;
}
.bench.idle .stations, .bench.idle .baractions { opacity: .55; pointer-events: none; }
.cupcol { position: sticky; top: 12px; display: grid; gap: 12px; min-width: 0; }
.ticket {
  background: #fff; border: 2px dashed var(--ink-soft); border-radius: 6px; padding: 10px 12px;
  font-family: var(--font-ticket); font-size: 13.5px; line-height: 1.4;
}
.ticket h4 { margin: 0 0 4px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; }
.ticket p { margin: 0; }
.cupcard { background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
#cupCv { display: block; width: 100%; height: 230px; }
.cupinfo { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); padding: 0 14px 12px; min-height: 2.9em; }
.baractions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }

.stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; min-width: 0; }
.station {
  position: relative; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px;
  padding: 12px 14px 14px; display: grid; gap: 10px; align-content: start; min-width: 0;
}
.station h3 { font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step {
  display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
  background: var(--ink); color: var(--paper); font-size: 13px; font-family: var(--font-body); font-weight: 800;
}
.station .hint { font-size: 12px; color: var(--ink-soft); font-weight: 700; margin-left: auto; font-family: var(--font-body); }
.station.locked > *:not(h3) { opacity: .35; pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 2px solid var(--ink); background: #fff; border-radius: 999px; padding: 4px 12px;
  font-weight: 700; font-size: 13.5px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .btn { flex: 1; }
.readout { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.readout span:last-child { color: var(--ink-soft); text-align: right; }

.meter { position: relative; height: 22px; border: 2px solid var(--ink); border-radius: 999px; background: #f4ece6; overflow: hidden; }
.meter .zone { position: absolute; top: 0; bottom: 0; background: rgba(140,199,174,.65); border-left: 2px dashed var(--good); border-right: 2px dashed var(--good); }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--wood); }
.meter .needle { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: var(--ink); border-radius: 2px; left: 0; }
.meter .band { position: absolute; top: 0; bottom: 0; opacity: .55; }
.meter .band.warm { background: var(--butter); }
.meter .band.normal { background: var(--blush); }
.meter .band.hot { background: var(--blush-deep); }
.meter.temp .fill { background: transparent; border-right: 4px solid var(--ink); }
.bandlabels { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 11.5px; font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.bandlabels span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.bandlabels i { width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid var(--ink); }

.shotlist { display: flex; gap: 6px; flex-wrap: wrap; min-height: 26px; }
.tag { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: #efe6df; }
.tag.good { background: #cfe9da; }
.tag.bad { background: #f6d0ca; }

.pumps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pump {
  border: 2px solid var(--ink); border-radius: 14px; background: #fff; cursor: pointer; padding: 8px 4px 6px;
  display: grid; justify-items: center; gap: 2px; font-weight: 800; font-size: 13px;
}
.pump .bottle { width: 22px; height: 30px; border: 2px solid var(--ink); border-radius: 6px 6px 8px 8px; position: relative; }
.pump .bottle::before { content: ""; position: absolute; left: 6px; top: -9px; width: 6px; height: 8px; background: var(--ink); border-radius: 2px; }
.pump .n { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.pump[aria-pressed="true"] { background: #fdf1d8; }
.pump:active { transform: translateY(2px); }

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  background: rgba(75,46,43,.45);
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
.overlay.menu { z-index: 26; background: var(--wall); background-image: repeating-linear-gradient(90deg, var(--wall) 0 22px, var(--wall-2) 22px 36px); }
.card {
  width: min(560px, 100%); background: var(--paper); border: 3px solid var(--ink); border-radius: 26px;
  box-shadow: 0 6px 0 var(--ink); padding: 22px; display: grid; gap: 14px; min-width: 0;
  animation: pop .28s cubic-bezier(.2,1.4,.5,1);
}
@keyframes pop { from { transform: translateY(18px) scale(.97); opacity: .4; } }
.logo { text-align: center; line-height: .9; }
.logo .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(52px, 13vw, 88px); letter-spacing: .02em; }
.logo .big b { color: var(--blush-deep); }
.logo .sub { font-weight: 800; letter-spacing: .3em; font-size: 12px; text-transform: uppercase; color: var(--ink-soft); margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats div { background: #f6ede6; border-radius: 14px; padding: 8px 4px; min-width: 0; }
.stats b { display: block; font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.menu-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.shop { display: grid; gap: 8px; }
.shop h3 { font-size: 16px; }
.upg { display: flex; align-items: center; gap: 10px; border: 2px solid #e6d9cf; border-radius: 14px; padding: 8px 10px; }
.upg div { flex: 1; min-width: 0; }
.upg b { display: block; font-size: 14px; }
.upg small { color: var(--ink-soft); font-weight: 600; }
.upg .btn { padding: 4px 12px; font-size: 13px; box-shadow: 0 2px 0 var(--ink); }
.stars { font-size: 34px; letter-spacing: 4px; text-align: center; color: #e6d9cf; line-height: 1; }
.stars .on { color: #f2b636; -webkit-text-stroke: 1.5px var(--ink); }
.quote { text-align: center; font-weight: 700; font-size: 16px; margin: 0; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.check { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 10px; background: #cfe9da; }
.check.no { background: #f6d0ca; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 88px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; font-weight: 800; }
.bar i { height: 10px; border-radius: 99px; background: #efe6df; overflow: hidden; display: block; }
.bar i em { display: block; height: 100%; background: var(--mint); border-radius: 99px; }
.bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 12px; }
.money { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.money span { background: var(--butter); border-radius: 12px; padding: 2px 12px; }
.money span.tip { background: #cfe9da; }
.book table { width: 100%; border-collapse: collapse; font-size: 13px; }
.book th, .book td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #eadfd6; vertical-align: top; }
.book th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.book .scroll { overflow-x: auto; }
.book ul { margin: 0; padding-left: 18px; font-size: 14px; }
.book li { margin-bottom: 3px; }
.toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); font-weight: 800; padding: 8px 16px; border-radius: 999px; z-index: 30;
  max-width: calc(100% - 32px); text-align: center;
}

@media (max-width: 760px) {
  .bench { grid-template-columns: minmax(0, 1fr); }
  .cupcol { position: static; }
  #cupCv { height: 200px; }
  .say { font-size: 15px; }
  .brand { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  .btn { transition: none; }
}
</style>

<header class="topbar">
  <div class="brand">CAFE C<b>&amp;</b>B</div>
  <div class="hud">
    <span class="pill" id="hudDay">Day 1</span>
    <span class="pill" id="hudCust">—</span>
    <span class="pill cash" id="hudCash">$0.00</span>
    <button class="iconbtn" id="bookBtn" type="button" data-t="recipes">Recipes</button>
    <button class="iconbtn" id="muteBtn" type="button">Sound on</button>
    <button class="iconbtn lang" id="langBtn" type="button" title="Language / Dil">TR</button>
    <button class="iconbtn" id="menuBtn" type="button" data-t="menu">Menu</button>
  </div>
</header>

<section class="scene" id="scene">
  <canvas id="sceneCv" aria-hidden="true"></canvas>
  <div class="talk">
    <div class="bubble" id="bubble" hidden>
      <div class="who"><span id="custName">Guest</span><span class="patience" title="Patience"><i id="patBar"></i></span></div>
      <p class="say" id="say" aria-live="polite"></p>
    </div>
    <div class="talk-actions" id="talkActions" hidden>
      <button class="btn go" id="takeBtn" type="button" data-t="startBrewing">Start brewing</button>
    </div>
  </div>
</section>

<main class="bench idle" id="bench">
  <div class="cupcol">
    <div class="ticket" id="ticket">
      <h4><span data-t="orderTicket">Order ticket</span><span id="ticketNo">#000</span></h4>
      <p id="ticketText"></p>
    </div>
    <div class="cupcard">
      <canvas id="cupCv" aria-label="Drink"></canvas>
      <div class="cupinfo" id="cupInfo"></div>
    </div>
    <div class="baractions">
      <button class="btn" id="trashBtn" type="button" data-t="trash">Trash it</button>
      <button class="btn primary big" id="serveBtn" type="button" data-t="serve">Serve</button>
    </div>
  </div>

  <div class="stations">
    <div class="station" id="stCup">
      <h3><span class="step">1</span><span data-t="cup">Cup</span></h3>
      <div class="chips" id="sizeChips"></div>
    </div>

    <div class="station" id="stGrind">
      <h3><span class="step">2</span><span data-t="grinder">Grinder</span> <span class="hint" id="doseZoneTxt"></span></h3>
      <div class="chips" id="beanChips"></div>
      <div class="meter" id="doseMeter"><div class="zone" id="doseZone"></div><div class="fill" id="doseFill"></div></div>
      <div class="readout"><span id="doseTxt">0.0 g</span><span id="doseMsg"></span></div>
      <div class="row">
        <button class="btn hold" id="grindBtn" type="button" data-t="holdGrind">Hold to grind</button>
        <button class="btn" id="dumpBtn" type="button" data-t="dump" hidden>Dump</button>
      </div>
    </div>

    <div class="station" id="stShot">
      <h3><span class="step">3</span><span data-t="espresso">Espresso</span> <span class="hint" data-t="stopAt">stop at 25–30 s</span></h3>
      <div class="meter" id="shotMeter"><div class="zone" id="shotZone"></div><div class="needle" id="shotNeedle"></div></div>
      <div class="readout"><span id="shotTxt">0 s</span><span id="shotMsg"></span></div>
      <button class="btn" id="shotBtn" type="button">Pull shot</button>
      <div class="shotlist" id="shotList"></div>
    </div>

    <div class="station" id="stMilk">
      <h3><span class="step">4</span><span data-t="steamWand">Steam wand</span></h3>
      <div class="chips" id="milkChips"></div>
      <div class="chips" id="foamChips"></div>
      <div>
        <div class="meter temp" id="tempMeter">
          <div class="band warm" id="bandWarm"></div><div class="band normal" id="bandNormal"></div><div class="band hot" id="bandHot"></div>
          <div class="fill" id="tempFill"></div>
        </div>
        <div class="bandlabels" id="bandLabels"></div>
      </div>
      <div class="readout"><span id="tempTxt">6 °C</span><span id="tempMsg"></span></div>
      <div class="row">
        <button class="btn hold" id="steamBtn" type="button" data-t="holdSteam">Hold to steam</button>
        <button class="btn" id="pourBtn" type="button">Pour</button>
      </div>
    </div>

    <div class="station" id="stSyrup">
      <h3><span class="step">5</span><span data-t="syrups">Syrups</span> <span class="hint" data-t="onePump">one tap = one pump</span></h3>
      <div class="pumps" id="syrupBtns"></div>
    </div>

    <div class="station" id="stTops">
      <h3><span class="step">6</span><span data-t="toppings">Toppings</span></h3>
      <div class="chips" id="topChips"></div>
    </div>
  </div>
</main>

<div class="overlay menu" id="ovMenu" hidden>
  <div class="card">
    <div class="logo"><div class="big">CAFE C<b>&amp;</b>B</div><div class="sub" data-t="sub">Barista Simulator</div></div>
    <div class="stats">
      <div><b id="mCash">$0</b><span data-t="savings">Savings</span></div>
      <div><b id="mDay">1</b><span data-t="nextDay">Next day</span></div>
      <div><b id="mBest">$0</b><span data-t="bestDay">Best day</span></div>
    </div>
    <div class="menu-actions">
      <button class="btn primary big" id="startBtn" type="button">Open the café</button>
      <button class="btn big" id="howBtn" type="button" data-t="howTo">How to brew</button>
      <button class="btn big" id="langBtn2" type="button">Türkçe</button>
    </div>
    <div class="shop" id="menuShop"></div>
    <div class="menu-actions"><button class="btn" id="resetBtn" type="button" data-t="reset">Reset progress</button></div>
  </div>
</div>

<div class="overlay" id="ovResult" hidden>
  <div class="card">
    <div class="stars" id="rStars"></div>
    <p class="quote" id="rQuote"></p>
    <div class="checks" id="rChecks"></div>
    <div class="bars" id="rBars"></div>
    <div class="money" id="rMoney"></div>
    <div class="menu-actions"><button class="btn go big" id="nextBtn" type="button">Next customer</button></div>
  </div>
</div>

<div class="overlay" id="ovDay" hidden>
  <div class="card">
    <h2 id="dTitle" style="text-align:center;font-size:30px">Day 1</h2>
    <div class="stats">
      <div><b id="dEarn">$0</b><span data-t="earned">Earned</span></div>
      <div><b id="dStars">0</b><span data-t="avgStars">Avg stars</span></div>
      <div><b id="dCash">$0</b><span data-t="savings">Savings</span></div>
    </div>
    <div class="shop" id="dayShop"></div>
    <div class="menu-actions">
      <button class="btn primary big" id="nextDayBtn" type="button">Open next day</button>
      <button class="btn big" id="toMenuBtn" type="button" data-t="toMenu">Main menu</button>
    </div>
  </div>
</div>

<div class="overlay" id="ovBook" hidden>
  <div class="card book">
    <h2 data-t="recipeBook">Recipe book</h2>
    <div id="bookBody"></div>
    <div class="menu-actions"><button class="btn go" id="closeBookBtn" type="button" data-t="backToBar">Back to the bar</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ---------------- audio ---------------- */
const sfx = {
  ctx: null, master: null, noise: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      const len = this.ctx.sampleRate * 2, b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
      this.master = this.ctx.createGain();
      this.master.gain.value = save.muted ? 0 : 0.55;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) { if (this.master) this.master.gain.value = m ? 0 : 0.55; },
  tone(freq, dur, type = 'sine', vol = 0.2, delay = 0, slide = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  loop(type, freq, q, vol, extra) {
    if (!this.ctx) return () => {};
    const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain(), t0 = this.ctx.currentTime;
    src.buffer = this.noise; src.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.06);
    src.connect(f); f.connect(g); g.connect(this.master); src.start();
    let osc = null;
    if (extra) {
      osc = this.ctx.createOscillator(); const og = this.ctx.createGain();
      osc.type = 'sawtooth'; osc.frequency.value = extra; og.gain.value = 0.04; osc.connect(og); og.connect(g); osc.start();

  burst(type, freq, dur, vol) { if (!this.ctx) return; const stop = this.loop(type, freq, 1, vol); setTimeout(stop, dur * 1000); },
  grind() { return this.loop('bandpass', 1700, 1.4, 0.4, 95); },
  steam() { return this.loop('highpass', 3200, 0.7, 0.22); },
  drip() { return this.loop('lowpass', 520, 3, 0.35); },
  pour() { this.burst('lowpass', 700, 0.7, 0.35); },
  pump() { this.tone(260, 0.12, 'sine', 0.18, 0, 0.6); },
  click() { this.tone(700, 0.05, 'triangle', 0.08); },
  bell() { this.tone(1318, 0.7, 'sine', 0.16); this.tone(1976, 0.6, 'sine', 0.06, 0.03); },
  coin() { this.tone(988, 0.09, 'square', 0.06); this.tone(1319, 0.28, 'square', 0.06, 0.09); },
  sad() { this.tone(392, 0.25, 'triangle', 0.12); this.tone(311, 0.4, 'triangle', 0.12, 0.2); },
};

/* ---------------- customers & orders ---------------- */
function makeCustomer() {
  return {
    name: pick(NAMES), skin: pick(SKIN), hair: pick(HAIR), shirt: pick(SHIRT), hat: pick(SHIRT),
    hairStyle: ri(5), glasses: Math.random() < 0.3, seed: rand(0, 6),

}

function makeOrder(day) {
  const h = Math.min(0.15 + (day - 1) * 0.12, 0.7), H = () => Math.random() < h;
  const r = { greet: ri(6), form: ri(4), q: ri(6) };
  if (day >= 3 && Math.random() < 0.14) return { surprise: true, constraint: pick(SURPRISE_KEYS), temp: 'normal', r };
  const pool = day === 1 ? ['latte', 'cappuccino', 'espresso', 'latte'] : Object.keys(DRINKS);
  const dk = pick(pool), D = DRINKS[dk];
  const o = { drink: dk, surprise: false, r };
  o.size = (dk === 'espresso' || dk === 'flatwhite') ? 'S' : pick(['S', 'M', 'M', 'L']);
  o.bean = Math.random() < (day === 1 ? 0.2 : 0.4) ? pick(['decaf', 'dark']) : 'esp';
  o.shots = dk === 'espresso' ? (Math.random() < 0.5 ? 2 : 1) : (day >= 2 && Math.random() < 0.2 ? 3 : 2);
  o.milk = D.milk ? (Math.random() < 0.45 ? 'whole' : pick(['oat', 'almond'])) : null;
  o.temp = D.milk ? (Math.random() < 0.6 ? 'normal' : pick(['warm', 'hot'])) : null;
  o.syrups = {};
  if (D.milk && day >= 2 && Math.random() < 0.45) o.syrups[pick(Object.keys(SYRUPS))] = pick([1, 1, 2, 2, 3]);
  o.tops = [...D.tops];
  if (D.milk && day >= 2 && Math.random() < 0.3) o.tops.push(pick(TOP_KEYS.filter(k => !o.tops.includes(k))));
  // which details the customer only hints at
  r.h = { size: H(), temp: H(), bean: H(), milk: H(), drink: H(), dbl: H(), x3: H(), syrup: H(), top: H() };
  return o;
}

function orderText(o, L) {
  const P = PH[L], r = o.r;
  const greet = P.greets[r.greet];
  if (o.surprise) return `${greet} ${P.surprise} ${STR[L].surprise[o.constraint][0]}`;
  const D = DRINKS[o.drink], adj = [], extra = [], tail = [];
  if (o.drink !== 'espresso' && o.drink !== 'flatwhite') {
    if (r.h.size) extra.push(P.sizeHint[o.size]); else adj.push(P.sizeAdj[o.size]);
  }
  if (o.temp && o.temp !== 'normal') { if (r.h.temp) extra.push(P.tempHint[o.temp]); else adj.push(P.tempAdj[o.temp]); }
  if (o.bean !== 'esp') { if (r.h.bean) extra.push(P.beanHint[o.bean]); else adj.push(P.beanAdj[o.bean]); }
  if (o.milk && o.milk !== 'whole') { if (r.h.milk) extra.push(P.milkHint[o.milk]); else adj.push(P.milkAdj[o.milk]); }
  let name = P.drink[o.drink], hinted = false;
  if (r.h.drink) { name = P.coffee; hinted = true; extra.unshift(P.drinkHint[o.drink]); }
  if (o.drink === 'espresso' && o.shots === 2) {
    if (r.h.dbl) extra.push(P.dblHint); else name = hinted ? P.dbl.coffee : P.dbl.espresso;
  }
  if (o.drink !== 'espresso' && o.shots === 3) { if (r.h.x3) extra.push(P.x3Hint); else tail.push(P.x3Tail); }
  for (const [k, n] of Object.entries(o.syrups)) { if (r.h.syrup) extra.push(P.syrupHint(n, k, P)); else tail.push(P.syrupTail(n, k, P)); }
  for (const k of o.tops.filter(x => !D.tops.includes(x))) { if (r.h.top) extra.push(P.topHint[k]); else tail.push(P.topTail[k]); }
  const main = P.build([...adj, name].join(' '), tail, r.form);

}
const curText = () => G.order ? orderText(G.order, save.lang) : '';

/* ---------------- scoring ---------------- */
function evaluate(o, c, patience) {
  const L = STR[save.lang], checks = [];
  const shotsN = c.shots.length;
  const sumSyr = obj => Object.values(obj).reduce((a, b) => a + b, 0);
  if (o.surprise) {
    const k = o.constraint, sp = L.surprise[k];
    checks.push({ label: L.chk.hasMilk, ok: !!c.milkType, say: L.say.saidMilk });
    checks.push({ label: L.chk.hasEsp, ok: shotsN > 0, say: L.say.noCoffee });
    const ok = { decaf: c.bean === 'decaf' && shotsN > 0, oat: c.milkType === 'oat', almond: c.milkType === 'almond',
      vanilla: (c.syrups.vanilla || 0) >= 1, cinnamon: c.tops.includes('cinnamon'), L: c.size === 'L' }[k];
    checks.push({ label: sp[1], ok, say: sp[2] });
  } else {
    const D = DRINKS[o.drink];
    checks.push({ label: fmt(L.chk.size, L.sizes[o.size]), ok: c.size === o.size, say: fmt(L.say.size, L.sizes[o.size].toLocaleLowerCase(save.lang)) });
    checks.push({ label: fmt(L.chk.beans, L.beans[o.bean]), ok: c.bean === o.bean && shotsN > 0, say: shotsN ? L.say.beans : L.say.noCoffee });
    checks.push({ label: L.chk.shots(o.shots), ok: shotsN === o.shots, say: shotsN > o.shots ? L.say.strong : L.say.weak });
    if (D.milk) {
      checks.push({ label: L.milkLabel[o.milk], ok: c.milkType === o.milk, say: c.milkType ? L.say.milk : L.say.whereMilk });
      checks.push({ label: L.foams[D.foam], ok: !!c.milkType && c.foamUsed === D.foam, say: c.milkType ? L.say.foam : L.say.whereMilk });
    } else {
      checks.push({ label: L.chk.noMilk, ok: !c.milkType, say: L.say.noMilk });
    }
    const wantS = Object.keys(o.syrups);
    const syrOk = Object.keys(SYRUPS).every(k => (o.syrups[k] || 0) === (c.syrups[k] || 0));
    checks.push({ label: wantS.length ? wantS.map(k => `${L.syrupNames[k]} ×${o.syrups[k]}`).join(', ') : L.chk.noSyrup, ok: syrOk,
      say: sumSyr(c.syrups) > sumSyr(o.syrups) ? L.say.sweet : L.say.sweetOff });
    const topOk = o.tops.length === c.tops.length && o.tops.every(x => c.tops.includes(x));
    checks.push({ label: o.tops.length ? o.tops.map(x => L.tops[x]).join(' + ') : L.chk.plainTop, ok: topOk, say: L.say.top });
  }
  const acc = checks.filter(x => x.ok).length / checks.length;

  const parts = [];
  if (shotsN) {
    parts.push({ name: L.bars.dose, v: c.doseQ, txt: c.dose.toFixed(1) + ' g' });
    const avg = c.shots.reduce((a, s) => a + s.q, 0) / shotsN;
    parts.push({ name: L.bars.shots, v: avg, txt: c.shots.map(s => Math.round(s.t) + ' ' + L.sec).join(' · ') });
  }
  if (c.milkType) {
    const band = TEMPS[o.temp || 'normal'], tm = c.milkTemp;
    const dist = tm < band.lo ? band.lo - tm : tm > band.hi ? tm - band.hi : 0;
    parts.push({ name: L.bars.milk, v: c.scorched ? 0 : Math.max(0, 1 - dist * 0.1), txt: Math.round(tm) + ' °C' + (c.scorched ? L.bars.scorched : '') });
  }
  const quality = parts.length ? parts.reduce((a, p) => a + p.v, 0) / parts.length : 0;
  const speed = Math.min(1, clamp(patience, 0, 1) * 1.4);
  const score = 0.55 * acc + 0.27 * quality + 0.18 * speed;
  const empty = !shotsN && !c.milkType;
  const stars = empty ? 1 : clamp(Math.round(score * 5), 1, 5);
  const base = (o.surprise ? 4.5 : DRINKS[o.drink].price) * SIZES[c.size].mult;
  // a badly wrong drink gets a reluctant partial payment; an empty cup gets nothing
  const pay = empty ? 0 : Math.round((acc >= 0.6 ? base : acc >= 0.3 ? base * 0.4 : 0) * 4) / 4;
  const tip = stars >= 4 ? Math.round(base * (stars === 5 ? 0.35 : 0.15) * (has('tipjar') ? 1.5 : 1) * 4) / 4 : 0;

  let quote;
  const miss = checks.find(x => !x.ok), q = o.r.q;
  if (stars === 5) quote = L.q5[q % L.q5.length];
  else if (stars === 4) quote = miss ? fmt(L.though, low1(miss.say, save.lang)) : L.q4[q % L.q4.length];
  else if (miss) quote = miss.say;
  else if (patience <= 0) quote = L.forever;
  else quote = L.meh[q % L.meh.length];
  return { checks, acc, parts, quality, speed, stars, pay, tip, quote };
}

/* ---------------- state machine ---------------- */
const OVERLAYS = { MENU: 'ovMenu', RESULT: 'ovResult', DAY_END: 'ovDay' };
function setState(s) {
  G.state = s;
  for (const [k, id] of Object.entries(OVERLAYS)) $('#' + id).hidden = k !== s;
  if (s === 'MENU') renderMenu();
  render();
}

function startDay() {
  sfx.init();
  G.day = save.day; G.idx = 0; G.total = Math.min(4 + G.day, 9); G.earned = 0; G.stars = [];
  G.patMax = 70 * (has('stools') ? 1.25 : 1);
  G.cust = null;
  nextCustomer();
}
function nextCustomer() {
  G.cust = makeCustomer();
  G.order = makeOrder(G.day);
  G.typed = 0; G.patience = 1; G.served = null; G.result = null; G.ticket++;
  resetCup();
  $('#say').textContent = '';
  $('#bubble').hidden = true;
  setState('ORDERING');
}
function onArrive() {
  sfx.bell();
  $('#bubble').hidden = false;
  $('#custName').textContent = G.cust.name;
}
function takeOrder() {
  if (G.state !== 'ORDERING') return;
  G.typed = Infinity;
  $('#say').textContent = curText();
  sfx.click();
  setState('BREWING');
}
function serve() {
  if (G.state !== 'BREWING') return;
  if (!cup.size) { toast(t('pickFirst')); return; }
  if (cup.shotting) stopShot();
  if (cup.grinding) grindEnd();
  if (cup.steaming) steamEnd();
  stopAllSounds();
  G.servedPatience = G.patience;
  const r = evaluate(G.order, cup, G.patience);
  G.result = r; G.served = cup;
  G.cust.mood = r.stars >= 5 ? 'delighted' : r.stars === 4 ? 'happy' : r.stars === 3 ? 'neutral' : 'upset';
  save.cash += r.pay + r.tip; save.served++; G.earned += r.pay + r.tip; G.stars.push(r.stars);
  persist();
  $('#say').textContent = r.quote;
  r.stars >= 3 ? sfx.coin() : sfx.sad();
  setState('SERVING');

  G.resultTimer = setTimeout(showResult, 1100);
}
function fillResult() {
  const r = G.result;
  $('#rStars').innerHTML = [1, 2, 3, 4, 5].map(i => `<span class="${i <= r.stars ? 'on' : ''}">★</span>`).join('');
  $('#rStars').setAttribute('aria-label', t('starsOf', r.stars));
  $('#rQuote').textContent = `“${r.quote}” — ${G.cust.name}`;
  $('#rChecks').innerHTML = r.checks.map(c => `<div class="check ${c.ok ? '' : 'no'}">${c.ok ? '✓' : '✗'} ${c.label}</div>`).join('');
  const L = S();
  const bars = [{ name: L.bars.order, v: r.acc, txt: Math.round(r.acc * 100) + '%' }, ...r.parts, { name: L.bars.speed, v: r.speed, txt: Math.round(r.speed * 100) + '%' }];
  $('#rBars').innerHTML = bars.map(b => `<div class="bar"><span>${b.name}</span><i><em style="width:${Math.round(b.v * 100)}%;background:${b.v >= 0.75 ? 'var(--mint)' : b.v >= 0.4 ? 'var(--butter)' : 'var(--blush-deep)'}"></em></i><span>${b.txt}</span></div>`).join('');

function showResult() {

}
function fillDay() {

/* ---------------- brewing actions ---------------- */
const canBrew = () => G.state === 'BREWING' && !!cup.size;

function pickBean(k) { if (!canBrew() || cup.ground) return; cup.bean = k; sfx.click(); render(); }

function grindEnd() {
  if (!cup.grinding) return;
  cup.grinding = false; if (stopGrindSnd) stopGrindSnd(); stopGrindSnd = null;
  if (cup.dose > 0.3) {
    cup.ground = true;
    const [lo, hi] = doseZone();
    const dist = cup.dose < lo ? lo - cup.dose : cup.dose > hi ? cup.dose - hi : 0;
    cup.doseQ = Math.max(0, 1 - dist * 0.35);

function dumpGrounds() { if (!canBrew()) return; cup.ground = false; cup.dose = 0; cup.doseQ = 0; sfx.click(); render(); }
const doseZone = () => has('grinder') ? [16, 20] : [17, 19];

  cup.shotting = true; cup.shotT = 0; stopShotSnd = sfx.drip(); render();
}

  if (!cup.shotting) return;

  const tm = cup.shotT, dist = tm < 25 ? 25 - tm : tm > 30 ? tm - 30 : 0;

}
function addSyrup(k) {

  const total = Object.values(cup.syrups).reduce((a, b) => a + b, 0);

}

/* ---------------- DOM wiring ---------------- */
function makeChips(el, keys, fn) {
  el.innerHTML = '';
  for (const k of keys) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.k = k;

function holdable(btn, onStart, onEnd) {
  let on = false;
  const start = () => { if (btn.disabled || on) return; on = true; btn.classList.add('active'); sfx.init(); onStart(); };
  const end = () => { if (!on) return; on = false; btn.classList.remove('active'); onEnd(); };

    const gr = g.createLinearGradient(0, y0, 0, y0 - total);
    gr.addColorStop(0, esp ? C.espresso : C.milk); gr.addColorStop(esp ? 0.25 : 0, latte); gr.addColorStop(1, latte);
    g.fillStyle = gr; g.fillRect(-ht - 2, y0 - total, d.t + 4, total + 0.6); yy -= total;
    const fh = px(foamMl);
    g.fillStyle = C.foam; g.fillRect(-ht - 2, yy - fh, d.t + 4, fh + 0.6);
    g.fillStyle = 'rgba(201,139,79,.18)';
    for (let i = 0; i < 9; i++) { circle(g, -ht + 8 + i * (d.t - 16) / 8, yy - fh * ((i * 37) % 10) / 10, 2 + (i % 3)); g.fill(); }
    yy -= fh;
  } else if (esp) {
    layer(Math.max(0, esp - 6), C.espresso);
    layer(Math.min(6, esp), C.crema);
  }
  g.restore();

  const surf = Math.max(-h, Math.min(yy, -2)), w = halfAt(surf) - 6;
  if (c.tops.includes('whip')) {
    g.fillStyle = '#ffffff'; g.lineWidth = 2.5;
    const r = w * 0.36;
    for (const [dx, dy] of [[-0.55, 0], [0.55, 0], [0, -0.1], [-0.28, -0.55], [0.28, -0.55], [0, -1]]) {
      circle(g, dx * w, surf - r * 0.4 + dy * r, r); g.fill(); g.stroke();
    }
  }
  const sprinkle = (col, seed, topY) => {
    g.fillStyle = col;
    for (let i = 0; i < 16; i++) {
      const u = ((i * 73 + seed) % 100) / 100 - 0.5, v = ((i * 41 + seed * 3) % 100) / 100;
      circle(g, u * w * 1.6, topY - v * 6, 1.8); g.fill();
    }
  };
  const topY = c.tops.includes('whip') ? surf - w * 0.36 * 1.6 : surf - 2;
  if (c.tops.includes('cocoa')) sprinkle('#6b3b26', 11, topY);
  if (c.tops.includes('cinnamon')) sprinkle('#b5652e', 29, topY);

  g.lineWidth = 3; g.strokeStyle = C.ink; g.stroke(body);
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(-ht + 10, -h + 12); g.lineTo(-hb + 8, -14); g.stroke();
  g.fillStyle = 'rgba(75,46,43,.55)'; g.font = `800 ${Math.round(h * 0.13)}px Grandstander, system-ui, sans-serif`;
  g.textAlign = 'center'; g.fillText('C&B', 0, -h * 0.32);

  if (c.milkPoured && c.milkTemp > 45 && !reduceMotion) {
    g.strokeStyle = 'rgba(133,103,95,.45)'; g.lineWidth = 3;
    for (let k = -1; k <= 1; k++) {
      g.beginPath();
      for (let i = 0; i <= 12; i++) {
        const py = -h - 8 - i * 3.2, pxx = k * 18 + Math.sin(T * 3 + i * 0.55 + k * 2) * 5;
        i ? g.lineTo(pxx, py) : g.moveTo(pxx, py);
      }
      g.stroke();
    }
  }
  g.restore();
}

function drawBench() {
  const g = cupG, W = dims.cw, H = dims.ch;
  if (!W) return;
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#f7eef4'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(75,46,43,.07)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 28) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H - 30); g.stroke(); }
  for (let y = 0; y < H - 30; y += 20) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.fillStyle = C.woodTop; g.fillRect(0, H - 30, W, 30);
  g.strokeStyle = C.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(0, H - 30); g.lineTo(W, H - 30); g.stroke();
  const cx = W / 2, by = H - 22, s = Math.min(1.15, (H - 40) / 190);
  const stream = cup.shotting ? C.espresso : (G.fxUntil > T ? G.fxColor : null);
  if (stream && cup.size) {
    g.strokeStyle = stream; g.lineWidth = cup.shotting ? 4 : 7; g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx, 0);
    for (let yv = 0; yv < by - 10; yv += 8) g.lineTo(cx + Math.sin(T * 20 + yv * 0.2) * 1.2, yv);
    g.stroke();
  }
  if (cup.size) drawCup(g, cup, cx, by, s);
  else {
    g.setLineDash([8, 6]); g.strokeStyle = 'rgba(75,46,43,.4)'; g.lineWidth = 2.5;
    g.beginPath(); g.ellipse(cx, by - 2, 52, 10, 0, 0, TAU); g.stroke(); g.setLineDash([]);
    g.fillStyle = 'rgba(75,46,43,.6)'; g.font = '700 15px Nunito, system-ui, sans-serif'; g.textAlign = 'center';
    g.fillText(G.state === 'BREWING' ? t('pickCup') : t('benchClear'), cx, by - 40);
  }
}

/* ---------------- main loop ---------------- */
function update(dt) {
  const L = S(), c = G.cust;
  if (c) {
    if (c.state === 'enter') {
      const tx = custTargetX();
      c.x = Math.min(tx, c.x + 240 * dt);
      if (c.x >= tx) { c.state = 'wait'; onArrive(); render(); }
    } else if (c.state === 'leave') {
      c.x += 280 * dt;
      if (c.x > dims.sw + 120) { onLeft(); return; }
    } else {
      c.x = custTargetX();
      if (G.state === 'ORDERING') {
        const text = curText();
        if (G.typed < text.length) {
          G.typed = Math.min(text.length, G.typed + 48 * dt);
          $('#say').textContent = text.slice(0, Math.floor(G.typed));
          if (G.typed >= text.length) render();
        }
      }
      if (G.state === 'ORDERING' || G.state === 'BREWING') {
        G.patience = Math.max(0, G.patience - dt / G.patMax);
        c.mood = G.patience > 0.55 ? 'happy' : G.patience > 0.25 ? 'neutral' : 'annoyed';
      }
    }
    const pb = $('#patBar');
    pb.style.width = (G.patience * 100) + '%';
    pb.style.background = G.patience > 0.55 ? 'var(--mint)' : G.patience > 0.25 ? 'var(--butter)' : 'var(--blush-deep)';
  }
  if (G.state === 'BREWING') {
    if (cup.grinding) {
      cup.dose = Math.min(25, cup.dose + 7 * dt);
      if (cup.dose >= 25) grindEnd();
    }
    if (cup.shotting) {
      cup.shotT += (has('gauge') ? 7.7 : 11) * dt;
      if (cup.shotT >= 45) stopShot();
    }
    if (cup.steaming) {
      cup.temp = Math.min(95, cup.temp + 15 * dt);
      if (cup.temp > 82) cup.scorched = true;
    }
  }
  $('#doseFill').style.width = (cup.dose / 25 * 100) + '%';
  $('#doseTxt').textContent = cup.dose.toFixed(1) + ' g';
  const [lo, hi] = doseZone();
  $('#doseMsg').textContent = cup.grinding ? L.grinding : !cup.ground ? L.holdGrind : cup.dose < lo ? L.doseLight : cup.dose > hi ? L.doseOver : L.perfectDose;
  $('#shotNeedle').style.left = (Math.min(45, cup.shotT) / 45 * 100) + '%';
  $('#shotTxt').textContent = Math.round(cup.shotT) + ' ' + L.sec;
  $('#shotMsg').textContent = cup.shotting ? (cup.shotT < 25 ? L.waitFor : cup.shotT <= 30 ? L.now : L.tooLong) : !cup.ground ? L.grindFirst : cup.shots.length >= 3 ? L.max3 : L.ready;
  const shown = cup.milkPoured ? cup.milkTemp : cup.temp;
  $('#tempFill').style.width = (Math.min(90, shown) / 90 * 100) + '%';
  $('#tempTxt').textContent = Math.round(shown) + ' °C';
  $('#tempMsg').textContent = cup.milkPoured ? L.poured : cup.scorched ? L.scorched : cup.steaming ? L.steaming : cup.temp >= 30 ? L.pourReady : L.holdSteam;
  if ($('#pourBtn').disabled === pourReady()) render();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; T += dt;
  try { update(dt); drawScene(); drawBench(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

function start() {
  resetCup();
  fit();
  sfx.setMuted(save.muted);
  applyLang();
  setState('MENU');
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
</script>
