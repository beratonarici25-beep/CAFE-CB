<button id="replay">↻ Tekrar</button>
<script>
(function(){
  // ?embed=1 -> tekrar butonu gizlenir (oyun içinde kullanım için)
  if(/[?&]embed=1/.test(location.search)) document.body.classList.add('embed');
  const cup=document.getElementById('cup'), text=document.getElementById('text'),
        wave=document.getElementById('wave'), btn=document.getElementById('replay');
  const pop='cubic-bezier(.2,.9,.25,1)';
  let anims=[];

  function play(){
    anims.forEach(a=>a.cancel()); anims=[]; btn.classList.remove('show');
    const intro=document.getElementById('intro'), logo=document.querySelector('.logo');
    intro.style.display='';
    const T={start:300, land:1400, wave:2500};
    const D=T.land-T.start;

    // 1) Bardak: soldan sağa fırlatılmış gibi, yay çizerek ve dönerek gelir
    anims.push(cup.animate([
      {opacity:1, transform:'translate(-130%,-35%) rotate(-70deg) scale(.9)'},
      {opacity:1, transform:'translate(-55%,-28%) rotate(-30deg) scale(.97)', offset:.4},
      {opacity:1, transform:'translate(5%,-4%) rotate(8deg) scale(1.03)', offset:.85},
      {opacity:1, transform:'translate(0,0) rotate(0deg) scale(1)'}
    ],{duration:D, delay:T.start, easing:'cubic-bezier(.25,.6,.35,1)', fill:'both'}));

    // 2) Yazı: aynı anda aşağıdan yukarı gelir, bardakla aynı anda oturur
    anims.push(text.animate([
      {opacity:1, transform:'translateY(110%)'},
      {opacity:1, transform:'translateY(-4%)', offset:.85},
      {opacity:1, transform:'translateY(0)'}
    ],{duration:D, delay:T.start, easing:'cubic-bezier(.25,.6,.35,1)', fill:'both'}));

    // 3) Birleşme anı: ikisi birlikte "pat" diye esneyip tek logo olur
    [cup,text].forEach(el=>anims.push(el.animate([
      {scale:'1 1'},{scale:'1.08 .93',offset:.25},{scale:'.97 1.04',offset:.55},{scale:'1.01 .99',offset:.8},{scale:'1 1'}
    ],{duration:600, delay:T.land, easing:'ease-out', composite:'add'})));

    // 4) Kırmızı dalga: tam merkezden dairesel açılır, tüm ekranı kaplar
    const w=wave.animate([
      {clipPath:'circle(0% at 50% 50%)'},
      {clipPath:'circle(75% at 50% 50%)'}
    ],{duration:1000, delay:T.wave, easing:'cubic-bezier(.55,.05,.3,1)', fill:'both'});
    anims.push(w);

    // 5) Sönme: ekran tamamen kırmızı olduktan sonra logo ve ekran kararıp kapanır
    const fadeDelay=T.wave+1000+500;
    anims.push(logo.animate([
      {transform:'scale(1)',opacity:1},{transform:'scale(.92)',opacity:0}
    ],{duration:600, delay:fadeDelay, easing:'ease-in', fill:'both'}));
    const f=intro.animate([{opacity:1},{opacity:0}],
      {duration:700, delay:fadeDelay+250, easing:'ease-in', fill:'both'});
    anims.push(f);

    f.finished.then(()=>{
      intro.style.display='none';
      btn.classList.add('show');
      // Oyun bu olayı dinleyip oyuna geçer
      window.dispatchEvent(new CustomEvent('cafecb:introend'));
      if(window.parent!==window) window.parent.postMessage('cafecb:introend','*');
    }).catch(()=>{});
  }
  btn.addEventListener('click',play);
  Promise.all([cup,text].map(i=>i.decode?i.decode():0)).finally(play);
})();
</script>
