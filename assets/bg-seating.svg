<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice">
  <!-- Middle-back layer: the seating area behind the customers. Shown slightly blurred for depth of field. -->
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5623a"/><stop offset="1" stop-color="#6e3b22"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c48c5c"/><stop offset="1" stop-color="#8c5a35"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f4a33" stop-opacity="0"/><stop offset="1" stop-color="#4a3022" stop-opacity=".55"/>
    </linearGradient>
    <g id="chair">
      <path d="M0 0 q0 -46 40 -46 h20 q40 0 40 46 v26 h-100z" fill="url(#leather)"/>
      <rect x="-8" y="-8" width="18" height="40" rx="8" fill="#8a4a2b"/><rect x="90" y="-8" width="18" height="40" rx="8" fill="#8a4a2b"/>
      <rect x="6" y="6" width="88" height="16" rx="6" fill="#b06d43"/>
      <rect x="4" y="32" width="5" height="12" fill="#1f1a19"/><rect x="91" y="32" width="5" height="12" fill="#1f1a19"/>
    </g>
    <g id="table">
      <ellipse cx="0" cy="0" rx="46" ry="9" fill="url(#tableTop)"/>
      <rect x="-3" y="6" width="6" height="52" fill="#1f1a19"/><ellipse cx="0" cy="58" rx="20" ry="4" fill="#1f1a19"/>
      <rect x="-14" y="-16" width="12" height="14" rx="2" fill="#f5efe6"/><rect x="6" y="-12" width="10" height="10" rx="2" fill="#f4b9b2"/>
    </g>
    <g id="monstera">
      <path d="M0 0 h40 l-6 46 h-28z" fill="#e8968c"/>
      <g fill="#4f8a4d">
        <path d="M20 0 q-60 -40 -40 -110 q40 10 40 110z"/><path d="M20 0 q60 -40 44 -120 q-44 14 -44 120z"/>
        <path d="M20 0 q-10 -80 10 -140 q22 70 -10 140z" fill="#5f9c58"/>
        <path d="M20 0 q-70 -10 -86 -60 q50 -10 86 60z" fill="#5f9c58"/><path d="M20 0 q70 -6 90 -54 q-54 -12 -90 54z"/>
      </g>
      <g stroke="#2f5a30" stroke-width="2" fill="none" opacity=".7">
        <path d="M20 0 l-24 -90"/><path d="M20 0 l30 -96"/><path d="M20 0 l-60 -50"/><path d="M20 0 l66 -46"/>
      </g>
    </g>
    <g id="ficus">
      <path d="M0 0 h34 l-5 40 h-24z" fill="#f5efe6"/>
      <rect x="15" y="-90" width="5" height="90" fill="#6b4a33"/>
      <g fill="#6f9a5c"><circle cx="18" cy="-110" r="30"/><circle cx="-6" cy="-92" r="20"/><circle cx="42" cy="-94" r="22"/><circle cx="18" cy="-138" r="20"/></g>
      <g fill="#86ad6d"><circle cx="8" cy="-118" r="10"/><circle cx="34" cy="-104" r="9"/></g>
    </g>
  </defs>

  <rect y="180" width="1600" height="120" fill="url(#floor)"/>

  <use href="#ficus" x="640" y="254"/>
  <use href="#chair" x="380" y="250"/>
  <use href="#table" x="510" y="238"/>
  <use href="#chair" x="560" y="252"/>

  <use href="#monstera" x="680" y="250"/>
  <use href="#table" x="800" y="236"/>
  <use href="#table" x="1000" y="240"/>
  <use href="#monstera" x="1080" y="252"/>

  <use href="#chair" x="1180" y="250"/>
  <use href="#table" x="1320" y="236"/>
  <use href="#chair" x="1380" y="252"/>
  <use href="#ficus" x="1520" y="254"/>
  <use href="#chair" x="60" y="252"/>
  <use href="#table" x="200" y="238"/>
</svg>
