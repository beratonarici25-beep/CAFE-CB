<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice">
  <!-- Far layer: back wall of the café. Exposed brick, concrete, windows to the street, shelves, chalkboard. -->
  <defs>
    <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c1b6"/><stop offset="1" stop-color="#b3aa9e"/>
    </linearGradient>
    <pattern id="brick" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#d8c3a8"/>
      <rect x="1" y="1" width="30" height="14" rx="2" fill="#a9573b"/>
      <rect x="33" y="1" width="30" height="14" rx="2" fill="#b4623f"/>
      <rect x="-15" y="17" width="30" height="14" rx="2" fill="#9c4f36"/>
      <rect x="17" y="17" width="30" height="14" rx="2" fill="#b86a45"/>
      <rect x="49" y="17" width="30" height="14" rx="2" fill="#a35a3c"/>
      <rect x="4" y="3" width="10" height="2" fill="#c47a55" opacity=".5"/>
      <rect x="40" y="19" width="8" height="2" fill="#c47a55" opacity=".5"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f2"/><stop offset=".7" stop-color="#f6e7c8"/><stop offset="1" stop-color="#e9d2a6"/>
    </linearGradient>
    <linearGradient id="shelfWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07a4f"/><stop offset="1" stop-color="#7a4e2f"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a14" stop-opacity=".28"/><stop offset=".25" stop-color="#2a1a14" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win1"><rect x="700" y="34" width="190" height="200" rx="4"/></clipPath>
    <clipPath id="win2"><rect x="910" y="34" width="190" height="200" rx="4"/></clipPath>
    <g id="street">
      <rect x="690" y="20" width="430" height="230" fill="url(#sky)"/>
      <!-- buildings across the road -->
      <path d="M690 150 h70 v-60 h40 v30 h60 v-70 h50 v80 h45 v-40 h55 v60 h40 v-30 h70 v130 h-430z" fill="#9fb3bf" opacity=".75"/>
      <g fill="#f8e7b5" opacity=".8">
        <rect x="770" y="100" width="8" height="10"/><rect x="785" y="100" width="8" height="10"/><rect x="872" y="70" width="8" height="10"/>
        <rect x="872" y="90" width="8" height="10"/><rect x="886" y="90" width="8" height="10"/><rect x="975" y="95" width="8" height="10"/>
        <rect x="1030" y="120" width="8" height="10"/><rect x="1044" y="120" width="8" height="10"/>
      </g>
      <!-- street tree and lamp -->
      <rect x="1010" y="120" width="6" height="110" fill="#5a4636"/>
      <circle cx="1013" cy="112" r="34" fill="#7fa46a" opacity=".85"/><circle cx="990" cy="128" r="22" fill="#6f975c" opacity=".85"/>
      <rect x="760" y="110" width="4" height="120" fill="#3b3330"/><circle cx="762" cy="108" r="7" fill="#fbe6a4"/>
      <rect x="690" y="208" width="430" height="42" fill="#8d8a86"/>
      <rect x="690" y="204" width="430" height="6" fill="#b9b4ac"/>
      <g fill="#f3f0e8"><rect x="720" y="228" width="40" height="4"/><rect x="820" y="228" width="40" height="4"/><rect x="920" y="228" width="40" height="4"/><rect x="1020" y="228" width="40" height="4"/></g>
    </g>
  </defs>

  <!-- concrete wall everywhere, brick on the sides -->
  <rect width="1600" height="300" fill="url(#concrete)"/>
  <g opacity=".18" fill="#7d7468"><circle cx="640" cy="60" r="2"/><circle cx="1150" cy="90" r="2"/><circle cx="660" cy="200" r="1.5"/><circle cx="1180" cy="40" r="1.5"/></g>
  <path d="M0 0 H640 L628 40 L646 80 L624 128 L650 170 L630 215 L648 260 L636 300 H0 Z" fill="url(#brick)"/>
  <path d="M1160 0 H1600 V300 H1150 L1166 252 L1148 205 L1170 160 L1152 110 L1172 62 L1154 22 Z" fill="url(#brick)"/>
  <path d="M640 0 L628 40 L646 80 L624 128 L650 170 L630 215 L648 260 L636 300" fill="none" stroke="#9c8f80" stroke-width="3" opacity=".6"/>
  <path d="M1160 0 L1154 22 L1172 62 L1152 110 L1170 160 L1148 205 L1166 252 L1150 300" fill="none" stroke="#9c8f80" stroke-width="3" opacity=".6"/>

  <!-- windows with black steel frames -->
  <g clip-path="url(#win1)"><use href="#street"/></g>
  <g clip-path="url(#win2)"><use href="#street"/></g>
  <g fill="none" stroke="#1f1a19" stroke-width="7">
    <rect x="700" y="34" width="190" height="200" rx="4"/><rect x="910" y="34" width="190" height="200" rx="4"/>
  </g>
  <g stroke="#1f1a19" stroke-width="3.5">
    <path d="M795 34 V234 M700 100 H890 M700 167 H890"/>
    <path d="M1005 34 V234 M910 100 H1100 M910 167 H1100"/>
  </g>
  <rect x="690" y="234" width="420" height="10" rx="3" fill="#2a2321"/>
  <!-- glass glare -->
  <g fill="#ffffff" opacity=".18"><path d="M712 40 l40 0 l-60 120 l0 -60z"/><path d="M922 40 l40 0 l-60 120 l0 -60z"/></g>

  <!-- left shelves -->
  <g id="shelvesL">
    <rect x="120" y="96" width="440" height="12" rx="3" fill="url(#shelfWood)"/>
    <rect x="120" y="170" width="440" height="12" rx="3" fill="url(#shelfWood)"/>
    <g fill="#1f1a19"><rect x="150" y="108" width="6" height="16"/><rect x="520" y="108" width="6" height="16"/><rect x="150" y="182" width="6" height="16"/><rect x="520" y="182" width="6" height="16"/></g>
    <!-- coffee bags -->
    <g>
      <path d="M140 96 v-40 l6 -8 h30 l6 8 v40z" fill="#c9a77c" stroke="#5a3b28" stroke-width="2"/>
      <rect x="148" y="66" width="26" height="16" rx="2" fill="#2f2523"/><text x="161" y="78" font-family="Georgia,serif" font-size="8" fill="#f1dcc0" text-anchor="middle">C&amp;B</text>
      <path d="M188 96 v-34 l5 -7 h26 l5 7 v34z" fill="#b08a62" stroke="#5a3b28" stroke-width="2"/>
      <rect x="195" y="70" width="22" height="13" rx="2" fill="#e8968c"/>
    </g>
    <!-- mugs -->
    <g stroke="#4b2e2b" stroke-width="2">
      <rect x="240" y="74" width="22" height="22" rx="4" fill="#f5efe6"/><path d="M262 80 q8 0 8 7 q0 7 -8 7" fill="none"/>
      <rect x="276" y="76" width="20" height="20" rx="4" fill="#8cc7ae"/><path d="M296 81 q7 0 7 6 q0 6 -7 6" fill="none"/>
      <rect x="310" y="74" width="22" height="22" rx="4" fill="#f4b9b2"/><path d="M332 80 q8 0 8 7 q0 7 -8 7" fill="none"/>
    </g>
    <!-- glass jars with beans -->
    <g stroke="#6f7f86" stroke-width="2">
      <rect x="360" y="60" width="28" height="36" rx="5" fill="#e7f0f2" opacity=".9"/><rect x="362" y="74" width="24" height="20" rx="3" fill="#5b3423" stroke="none"/>
      <rect x="358" y="54" width="32" height="8" rx="2" fill="#8f9aa0"/>
      <rect x="398" y="66" width="26" height="30" rx="5" fill="#e7f0f2" opacity=".9"/><rect x="400" y="78" width="22" height="16" rx="3" fill="#8a6a4a" stroke="none"/>
      <rect x="396" y="60" width="30" height="8" rx="2" fill="#8f9aa0"/>
    </g>
    <!-- V60 dripper and Chemex -->
    <path d="M440 70 h34 l-12 22 h-10z" fill="#f5efe6" stroke="#4b2e2b" stroke-width="2"/><rect x="446" y="92" width="22" height="4" fill="#4b2e2b"/>
    <path d="M492 56 h26 l-10 22 l10 18 h-26 l10 -18z" fill="#e7f0f2" stroke="#4b2e2b" stroke-width="2" opacity=".95"/>
    <path d="M498 76 h14 l-3 -4 h-8z" fill="#b5652e"/><rect x="497" y="78" width="16" height="5" fill="#c9a77c"/>
    <!-- lower shelf: plates stack, grinder, bags -->
    <g stroke="#4b2e2b" stroke-width="2">
      <rect x="150" y="150" width="44" height="6" rx="3" fill="#f5efe6"/><rect x="152" y="144" width="40" height="6" rx="3" fill="#f5efe6"/><rect x="154" y="138" width="36" height="6" rx="3" fill="#f5efe6"/>
      <path d="M220 170 v-30 l5 -6 h22 l5 6 v30z" fill="#c9a77c"/><path d="M262 170 v-26 l5 -6 h20 l5 6 v26z" fill="#b08a62"/>
      <rect x="320" y="126" width="30" height="44" rx="4" fill="#2f2523"/><path d="M322 126 l4 -14 h18 l4 14z" fill="#e7f0f2"/>
      <rect x="372" y="146" width="24" height="24" rx="3" fill="#8cc7ae"/><rect x="402" y="140" width="22" height="30" rx="3" fill="#f6d88c"/>
      <rect x="440" y="130" width="60" height="40" rx="4" fill="#f5efe6"/>
    </g>
    <text x="470" y="155" font-family="Georgia,serif" font-size="11" fill="#4b2e2b" text-anchor="middle">BEANS</text>
    <!-- trailing ivy -->
    <g fill="#6f9a5c" stroke="#45673a" stroke-width="1">
      <path d="M128 108 q-6 30 4 60 q-8 26 2 54" fill="none" stroke="#45673a" stroke-width="2"/>
      <ellipse cx="124" cy="120" rx="7" ry="4" transform="rotate(-30 124 120)"/><ellipse cx="134" cy="136" rx="7" ry="4" transform="rotate(30 134 136)"/>
      <ellipse cx="126" cy="152" rx="7" ry="4" transform="rotate(-30 126 152)"/><ellipse cx="132" cy="190" rx="7" ry="4" transform="rotate(25 132 190)"/>
      <ellipse cx="128" cy="208" rx="7" ry="4" transform="rotate(-20 128 208)"/>
      <path d="M548 108 q8 22 -2 46" fill="none" stroke="#45673a" stroke-width="2"/>
      <ellipse cx="552" cy="120" rx="7" ry="4" transform="rotate(30 552 120)"/><ellipse cx="546" cy="138" rx="7" ry="4" transform="rotate(-30 546 138)"/>
      <ellipse cx="548" cy="152" rx="6" ry="4"/>
    </g>
  </g>

  <!-- chalkboard menu on the right brick -->
  <g>
    <rect x="1210" y="54" width="230" height="150" rx="6" fill="#7a4e2f"/>
    <rect x="1220" y="64" width="210" height="130" rx="3" fill="#2d3330"/>
    <g font-family="'Pacifico','Brush Script MT',cursive" fill="#f4efe6" opacity=".92">
      <text x="1325" y="90" font-size="17" text-anchor="middle">Menu</text>
    </g>
    <g font-family="'Courier Prime','Courier New',monospace" font-size="11" fill="#e8e2d6" opacity=".85">
      <text x="1236" y="112">ESPRESSO</text><text x="1414" y="112" text-anchor="end">2.50</text>
      <text x="1236" y="128">LATTE</text><text x="1414" y="128" text-anchor="end">4.00</text>
      <text x="1236" y="144">CAPPUCCINO</text><text x="1414" y="144" text-anchor="end">4.25</text>
      <text x="1236" y="160">FLAT WHITE</text><text x="1414" y="160" text-anchor="end">4.00</text>
      <text x="1236" y="176">MOCHA</text><text x="1414" y="176" text-anchor="end">5.00</text>
    </g>
    <path d="M1236 184 q20 -6 40 0 t40 0" fill="none" stroke="#f6d88c" stroke-width="1.5" opacity=".7"/>
  </g>
  <!-- right shelf with a plant -->
  <rect x="1460" y="120" width="130" height="10" rx="3" fill="url(#shelfWood)"/>
  <g stroke="#4b2e2b" stroke-width="2">
    <path d="M1480 120 l4 -22 h24 l4 22z" fill="#e8968c"/>
    <rect x="1532" y="96" width="20" height="24" rx="3" fill="#f5efe6"/><rect x="1558" y="102" width="18" height="18" rx="3" fill="#8cc7ae"/>
  </g>
  <g fill="#7fb48f" stroke="#45673a" stroke-width="1.5">
    <ellipse cx="1486" cy="92" rx="10" ry="5" transform="rotate(-35 1486 92)"/><ellipse cx="1504" cy="88" rx="10" ry="5" transform="rotate(30 1504 88)"/>
    <ellipse cx="1496" cy="82" rx="9" ry="5" transform="rotate(-80 1496 82)"/>
    <path d="M1490 120 q-6 30 2 60" fill="none"/><ellipse cx="1488" cy="140" rx="6" ry="3.5" transform="rotate(-30 1488 140)"/><ellipse cx="1494" cy="160" rx="6" ry="3.5" transform="rotate(30 1494 160)"/>
  </g>

  <!-- soft shadow under the ceiling -->
  <rect width="1600" height="300" fill="url(#shade)"/>
</svg>
